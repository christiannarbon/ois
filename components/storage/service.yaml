apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: storage
  labels:
    app.kubernetes.io/part-of: open-iceberg-stack
    app.kubernetes.io/component: storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
